services:

  valkey:
    image: valkey/valkey:latest
    container_name: valkey-so1-202112092
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - valkey_data:/data

    command:
      - valkey-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  grafana:
    image: grafana/grafana:latest
    container_name: grafana-so1-202112092
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      - GF_INSTALL_PLUGINS=redis-datasource

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

    depends_on:
      valkey:
        condition: service_healthy


volumes:
  valkey_data:
  grafana_data: